train_bin = "data/ts/train.bin"
val_bin = "data/ts/val.bin"
meta_path = "data/ts/meta.json"
out_dir = "checkpoints/tiny_shakespeare"
device = "cuda"
dtype = "bfloat16"
compile = true

[model]
hidden = 512
ffn = 1408
layers = 6
heads = 8
kv_heads = 2
seq_len = 256
rope_theta = 10000.0
norm_eps = 0.00001
tie_embeddings = true

[train]
lr = 0.0006
warmup = 100
min_lr_ratio = 0.1
batch = 32
accum = 1
steps = 2000
weight_decay = 0.1
beta1 = 0.9
beta2 = 0.95
grad_clip = 1.0
log_every = 25
eval_every = 500
save_every = 1000
seed = 42

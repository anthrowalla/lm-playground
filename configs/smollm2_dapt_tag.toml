train_bin = "data/adapt_b/train.bin"
val_bin = "data/adapt_b/val.bin"
meta_path = "data/adapt_b/meta.json"
out_dir = "checkpoints/smollm2_dapt_tag"
device = "cuda"
dtype = "bfloat16"
compile = true

[model]
hidden = 960
ffn = 2560
layers = 32
heads = 15
kv_heads = 5
seq_len = 1024
rope_theta = 100000.0
norm_eps = 0.00001
tie_embeddings = true

[train]
lr = 0.00002
warmup = 100
min_lr_ratio = 0.1
batch = 32
accum = 1
steps = 31000
weight_decay = 0.1
beta1 = 0.9
beta2 = 0.95
grad_clip = 1.0
log_every = 10
eval_every = 2000
save_every = 0
seed = 42

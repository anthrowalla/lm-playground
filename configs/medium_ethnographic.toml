train_bin = "data/ethnographic/train.bin"
val_bin = "data/ethnographic/val.bin"
meta_path = "data/ethnographic/meta.json"
out_dir = "checkpoints/medium_ethnographic"
device = "cuda"
dtype = "bfloat16"
compile = true

[model]
hidden = 1024
ffn = 2816
layers = 24
heads = 16
kv_heads = 4
seq_len = 1024
rope_theta = 10000.0
norm_eps = 0.00001
tie_embeddings = true

[train]
lr = 0.0003
warmup = 1000
min_lr_ratio = 0.1
batch = 8
accum = 4
steps = 20000
weight_decay = 0.1
beta1 = 0.9
beta2 = 0.95
grad_clip = 1.0
log_every = 10
eval_every = 500
save_every = 2000
seed = 42

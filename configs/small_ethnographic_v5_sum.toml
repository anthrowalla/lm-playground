train_bin = "data/ethnographic_v5/train.bin"
val_bin = "data/ethnographic_v5/val.bin"
meta_path = "data/ethnographic_v5/meta.json"
out_dir = "checkpoints/small_ethnographic_v5_sum"
device = "cuda"
dtype = "bfloat16"
compile = true

[model]
hidden = 768
ffn = 2688
layers = 12
heads = 12
kv_heads = 4
seq_len = 1024
rope_theta = 10000.0
norm_eps = 0.00001
tie_embeddings = true

[train]
lr = 0.00002
warmup = 50
min_lr_ratio = 0.1
batch = 32
accum = 1
steps = 3000
weight_decay = 0.1
beta1 = 0.9
beta2 = 0.95
grad_clip = 1.0
log_every = 10
eval_every = 0
save_every = 0
seed = 42

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Analyst assist — completion</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 2rem; max-width: 70rem; }
  h1 { font-size: 1.2rem; }
  .row { display: flex; align-items: center; gap: 1rem; margin-bottom: 0.75rem; }
  textarea { width: 100%; height: 16rem; font-family: ui-monospace, monospace;
             font-size: 0.95rem; box-sizing: border-box; }
  button { padding: 0.5rem 1.5rem; font-size: 1rem; cursor: pointer; }
  label { font-size: 0.9rem; }
  input[type=number] { width: 5rem; }
  #status { font-size: 0.9rem; color: #666; }
</style>
</head>
<body>
<h1>Analyst assist — completion</h1>
<div class="row">
  <button id="go">Analyze</button>
  <label><input id="fixed" type="checkbox"> Fixed</label>
  <label>Flexibility <input id="temp" type="number" value="0.7" min="0" max="2" step="0.1"></label>
  <label><input id="raw" type="checkbox"> raw output</label>
  <label>n_predict <input id="np" type="number" value="256" min="1" max="4096"></label>
  <span id="status"></span>
</div>
<textarea id="in" placeholder="Paste text to continue here…"></textarea>
<p></p>
<textarea id="out" placeholder="Results appear here…" readonly></textarea>
<script>
const $ = id => document.getElementById(id);

// The tag model replies with at most one useful line — the first line that
// starts with a digit (the OCM codes). Everything else is continuation or
// next-section debris, so drop it and stop at the first numeric line.
function filterTags(text) {
  for (const line of text.split("\n")) {
    if (/^\s*\d/.test(line)) return line.trim();
  }
  return "";
}

// Fixed pins decoding to temperature 0 (deterministic); unticking restores
// the previous Flexibility value (default 0.7)
let lastFlex = 0.7;
$("fixed").onchange = () => {
  const t = $("temp");
  if ($("fixed").checked) {
    const v = parseFloat(t.value);
    if (v > 0) lastFlex = v;
    t.value = 0;
    t.disabled = true;
  } else {
    t.value = lastFlex;
    t.disabled = false;
  }
};

async function complete(body) {
  const r = await fetch("/completion", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  if (!r.ok) throw new Error(`HTTP ${r.status}: ${await r.text()}`);
  return r.json();
}

$("go").onclick = async () => {
  const prompt = $("in").value;
  if (!prompt.trim()) { $("status").textContent = "input is empty"; return; }
  const raw = $("raw").checked;
  const flex = parseFloat($("temp").value) || 0;
  $("go").disabled = true;
  $("status").textContent = "generating…";
  const t0 = performance.now();
  try {
    const base = {
      prompt: prompt,
      n_predict: parseInt($("np").value) || 256,
      temperature: flex,
      ignore_eos: true,
      stop: raw ? [] : ["\n\n"],
    };
    let data = await complete(base);
    let rawOut = data.content ?? "";
    let tags = filterTags(rawOut);
    if (!raw && !tags) {
      // a blank line preceded the OCM line and the early stop cut it off —
      // rerun without the stop and let the filter find the line
      $("status").textContent = "retrying without early stop…";
      data = await complete({ ...base, stop: [] });
      rawOut = data.content ?? "";
      tags = filterTags(rawOut);
    }
    let fellBack = false;
    if (!raw && !tags && flex === 0) {
      // greedy decode dead-ended with no tag line — resample once at the
      // default flexibility
      $("status").textContent = "no result at Fixed — retrying at Flexibility 0.7…";
      data = await complete({ ...base, stop: [], temperature: 0.7 });
      rawOut = data.content ?? "";
      tags = filterTags(rawOut);
      fellBack = true;
    }
    $("out").value = raw ? rawOut : tags;
    const ms = Math.round(performance.now() - t0);
    let status =
      `done in ${(ms / 1000).toFixed(1)} s (${data.tokens_predicted ?? "?"} tokens)`;
    if (fellBack && tags)
      status += " — Fixed had no result; sampled at Flexibility 0.7";
    if (!raw && !tags) status += " — no OCM line found; tick 'raw output' to inspect";
    $("status").textContent = status;
  } catch (e) {
    $("status").textContent = "error: " + e.message;
    $("out").value = "";
  } finally {
    $("go").disabled = false;
  }
};
</script>
</body>
</html>
